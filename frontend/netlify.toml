# Deploiement Netlify du site TERWA (Next.js).
# Les variables NEXT_PUBLIC_* sont publiques par nature (identifiants de
# contrats testnet et URLs publiques) : elles peuvent vivre dans ce fichier.
# Regenere a chaque redeploiement des contrats (etape 4 de la livraison).

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers. frame-ancestors 'none' and X-Frame-Options block
# clickjacking of the connect and purchase flows; the rest are cheap
# hardening. A full resource CSP is deferred: the Sumsub liveness iframe and
# the wallet, RPC and Horizon origins need it validated against the live site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "frame-ancestors 'none'"
    Permissions-Policy = "geolocation=(), payment=()"

