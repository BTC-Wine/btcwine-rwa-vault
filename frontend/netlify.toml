# Deploiement Netlify du site TERWA (Next.js).
# Les variables NEXT_PUBLIC_* sont publiques par nature (identifiants de
# contrats testnet et URLs publiques) : elles peuvent vivre dans ce fichier.
# Regenere par scripts/sync-frontend-env.sh dans le monorepo a chaque
# redeploiement des contrats.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NEXT_PUBLIC_NETWORK_PASSPHRASE = "Test SDF Network ; September 2015"
